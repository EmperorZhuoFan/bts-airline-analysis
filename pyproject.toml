[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-bts-ml-system"
version = "0.1.0"
description = "End-to-end airline operations analysis and machine learning system using BTS data"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]